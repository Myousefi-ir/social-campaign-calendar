  --thu:#18212F; --thu-ink:#9DB6E0; --fri:#2B1B1E; --fri-ink:#F08A80;
  --st-brief:#5EC4C9; --st-review:#B79AF0; --danger-soft:#3A1F22;
  --shadow:0 10px 40px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E141A; --surface:#161F28; --sunk:#111920; --ink:#E4EAF0; --muted:#94A2AF; --line:#27333F;
  --accent:#6BA7D8; --accent-ink:#0E141A; --ipo:#E3A052; --ipo-soft:#33261A; --today:#6BA7D8;
  --danger:#F08A80; --ok:#6CC894; --warn:#E3B04F; --info:#6BA7D8; --idle:#8D99A5;
  --thu:#18212F; --thu-ink:#9DB6E0; --fri:#2B1B1E; --fri-ink:#F08A80;
  --st-brief:#5EC4C9; --st-review:#B79AF0; --danger-soft:#3A1F22;
  --shadow:0 10px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;font-size:14px;line-height:1.6;padding-inline:16px;padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin-inline:auto}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:22px 16px}
.brand{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:2px}
.title-input,.sub-input{font:inherit;background:transparent;border:1px dashed transparent;border-radius:8px;padding:1px 6px;margin-inline-start:-7px;width:100%;max-width:640px;color:var(--ink)}
.title-input{font-size:24px;font-weight:800}
.sub-input{font-size:12.5px;color:var(--muted)}
.title-input:hover,.sub-input:hover{border-color:var(--line)}
.title-input:focus,.sub-input:focus{border-color:var(--accent);border-style:solid;outline:none;background:var(--surface)}
.title-input::placeholder,.sub-input::placeholder{color:var(--muted);opacity:.75}
.chpick{display:flex;flex-wrap:wrap;gap:6px}
.pick{--c:#888;border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:3px 12px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.pick[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 16%,var(--surface));border-color:var(--c);font-weight:700}
.pick[aria-pressed="true"]::after{content:"✓";font-size:11px}
.pick.add{border-style:dashed;color:var(--accent);background:transparent}
.chs{display:flex;flex-wrap:wrap;gap:4px 10px}
.row .chs{flex-direction:column;align-items:flex-start;gap:2px}
.chip .cd{display:inline-flex;gap:2px;margin-inline-end:4px;vertical-align:-2px}
.chip .cd .lg{width:12px;height:12px;border-radius:3px}
.danger-box{border:1px solid color-mix(in srgb,var(--danger) 35%,var(--line));border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.danger-box h3{margin:0;font-size:15px;font-weight:800}
.danger-box p{margin:0;color:var(--muted);font-size:12.5px}
.ipo-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.ipo-card .big{font-size:26px;font-weight:800;color:var(--ipo);line-height:1}
.ipo-card .lbl{font-size:12px;color:var(--muted)}
.ipo-card .date{font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-block:10px;border-top:1px solid var(--line)}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;border-radius:6px;padding:5px 14px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select.f{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;max-width:180px}
.stats{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);padding-block:4px 12px}
.stats b{color:var(--ink);font-size:14px}

/* status pill */
.st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;border-radius:99px;padding:1px 9px;border:1px solid currentColor;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.s-idea{color:var(--idle)} .st.s-prod{color:var(--warn)} .st.s-ready{color:var(--info)} .st.s-done{color:var(--ok)}
.st.s-none{color:var(--muted);border-style:dashed;opacity:.8}
.st.s-none::before{display:none}

/* channel chip */
.ch{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
.lg{--c:#8A949E;display:inline-flex;flex:none;width:16px;height:16px;border-radius:4px;overflow:hidden;align-items:center;justify-content:center}
.lg svg,.lg img{width:100%;height:100%;display:block;object-fit:cover}
.lg.ini{background:var(--c);color:#fff;font-size:10px;font-weight:800;line-height:1}
.chrows{display:flex;flex-direction:column;gap:6px}
.chrow{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 10px;border:1px solid var(--line);border-radius:9px}
.chrow .lg{width:22px;height:22px;border-radius:6px}
.chrow .nm{flex:1;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chrow .btn{padding:3px 9px;font-size:12.5px}
/* channel modal */
.mscrim{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:30}
.modal{position:fixed;z-index:31;inset-inline:0;margin-inline:auto;top:calc(env(safe-area-inset-top,0px) + 7vh);width:min(430px,calc(100% - 32px));max-height:84vh;overflow:auto;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px}
.modal h3{margin:0;font-size:17px;font-weight:800}
.mdhead{display:flex;gap:14px;align-items:flex-end}
.mdprev .lg{width:56px;height:56px;border-radius:14px}
.mdprev .lg.ini{font-size:24px}
.swatches{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);background:var(--c);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.fld input.swc,.swc{width:38px;height:30px;padding:2px;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer;flex:none}
.mdfoot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
/* charts */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin-block:4px 14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-size:26px;font-weight:800;line-height:1.25}
.kpi .k{font-size:12.5px;font-weight:700}
.kpi .d{font-size:11.5px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;min-width:0}
.panel h3{margin:0;font-size:15px;font-weight:800}
.panel .sub{margin:2px 0 12px;font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:0 14px}
.legend2{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:10px;font-size:12px}
.legend2 .ch{font-weight:500}
.legend2 .num{color:var(--muted)}
.tlwrap{overflow-x:auto;padding-bottom:4px}
.tlin{min-width:calc(var(--n) * 14px + 34px);padding-inline-start:34px}
.plot{position:relative}
.gl{position:absolute;inset-inline:0;height:0;border-top:1px dashed var(--line)}
.gl.base{border-top:1px solid var(--muted)}
.gl span{position:absolute;inset-inline-start:-34px;width:28px;transform:translateY(-50%);font-size:10.5px;color:var(--muted);text-align:end}
.cols{position:absolute;inset:0;display:flex;gap:2px}
.col{flex:1 1 0;min-width:10px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;border-radius:4px 4px 0 0}
.col:hover,.col:focus-visible{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.col.zero{background:color-mix(in srgb,var(--ipo) 12%,transparent)}
.stk{display:flex;flex-direction:column-reverse;gap:2px;width:100%;max-width:28px}
.stk i{display:block;min-height:2px}
.stk i:last-child{border-radius:4px 4px 0 0}
.tot{font-size:10px;color:var(--muted);line-height:1;margin-bottom:3px}
.xls{display:flex;gap:2px;margin-top:4px}
.xl{flex:1 1 0;min-width:10px;font-size:10px;color:var(--muted);text-align:center;white-space:nowrap}
.xl.zero{color:var(--ipo);font-weight:800}
.hb{display:flex;flex-direction:column;gap:8px}
.hbr{display:grid;grid-template-columns:minmax(96px,34%) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hbl{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbt{height:10px;background:var(--sunk);border-start-end-radius:4px;border-end-end-radius:4px}
.hbt i{display:block;height:100%;border-start-end-radius:4px;border-end-end-radius:4px;min-width:2px}
.hbv{font-weight:700;white-space:nowrap}
.hbv small{font-weight:400;color:var(--muted)}
.split{display:flex;gap:2px;height:14px;margin-block:4px 10px}
.split i{display:block;height:100%}
.split i:first-child{border-start-start-radius:4px;border-end-start-radius:4px}
.split i:last-child{border-start-end-radius:4px;border-end-end-radius:4px}
.tip{position:fixed;z-index:25;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:8px 10px;font-size:12px;pointer-events:none;min-width:170px;max-width:260px}
.tip b{display:block;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:12px;align-items:center}
.tip .ft{margin-top:5px;padding-top:5px;border-top:1px solid var(--line);color:var(--muted)}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-block:4px 10px;flex-wrap:wrap}
.calhead h2{margin:0;font-size:20px;font-weight:800}
.calnav{display:flex;gap:6px;flex-wrap:wrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .wd{background:var(--sunk);text-align:center;font-size:12px;color:var(--muted);padding:6px 0;font-weight:500}
.cell{background:var(--surface);min-height:118px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:4px;text-align:start;border:0;border-radius:0;position:relative}
.cell:hover{background:var(--sunk)}
.cell.out{background:var(--sunk);opacity:.55}
.cell .dh{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.cell .dn{font-weight:700;font-size:15px}
.cell .dd{font-size:10.5px;color:var(--muted)}
.cal .cell.today .dn{background:var(--today);color:var(--surface);border-radius:6px;padding:0 6px}
.cell.thu{background:var(--thu)} .cell.fri{background:var(--fri)}
.cell.thu:hover{background:color-mix(in srgb,var(--thu-ink) 10%,var(--thu))} .cell.fri:hover{background:color-mix(in srgb,var(--fri-ink) 8%,var(--fri))}
.cell.thu .dn{color:var(--thu-ink)} .cell.fri .dn{color:var(--fri-ink)}
.cal .wd.thu{background:var(--thu);color:var(--thu-ink);font-weight:700} .cal .wd.fri{background:var(--fri);color:var(--fri-ink);font-weight:700}
.cell.ipo{background:var(--ipo-soft);box-shadow:inset 0 0 0 2px var(--ipo)}
.legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-inline-end:5px;border:1px solid var(--line)}
.cell.ipo .dd{color:var(--ipo);font-weight:800}
.chip{--c:#888;display:block;font-size:11.5px;line-height:1.45;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-inline-start:3px solid var(--c)}
.chip.pend{background:transparent;outline:1px dashed color-mix(in srgb,var(--warn) 70%,transparent);outline-offset:-1px}
.more{font-size:11px;color:var(--muted)}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
@media (max-width:700px){
  .cell{min-height:64px;padding:4px}
  .cell .chip,.cell .more{display:none}
  .dots{display:flex}
  .cell .dd{display:none}
  .cell.ipo .dd{display:block;font-size:9px}
}

/* roadmap */
.phase{margin-block:22px 8px;display:flex;align-items:baseline;gap:10px}
.phase h3{margin:0;font-size:16px;font-weight:800}
.phase span{color:var(--muted);font-size:12px}
.day{display:grid;grid-template-columns:150px 1fr;gap:14px;padding-block:12px;border-top:1px solid var(--line)}
.day.ipo{background:var(--ipo-soft);border-radius:12px;border-top:0;padding-inline:12px;margin-block:4px}
.day .when{display:flex;flex-direction:column;gap:2px}
.day .when .dl{font-weight:800;font-size:15px}
.day.ipo .when .dl{color:var(--ipo)}
.day .when .full{font-size:12.5px;color:var(--muted)}
.day.thu .when .full{color:var(--thu-ink);font-weight:700} .day.fri .when .full{color:var(--fri-ink);font-weight:700}
.offtag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--fri-ink);background:var(--fri);border-radius:4px;padding:0 6px;margin-inline-start:4px}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;text-align:start;width:100%}
.row:hover{border-color:var(--accent)}
.row .t{font-weight:500}
.row .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}
.row .side{display:flex;gap:8px;align-items:center}
.addrow{align-self:flex-start;font-size:12.5px;color:var(--accent);background:none;border:0;padding:2px 0}
@media (max-width:700px){
  .day{grid-template-columns:1fr;gap:6px}
  .row{grid-template-columns:1fr;gap:4px}
  .row .side{justify-content:flex-start}
}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.38);z-index:20}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(540px,100%);background:var(--surface);box-shadow:var(--shadow);z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0;font-size:18px;font-weight:800}
.drawer header p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.drawer .body{flex:1;overflow:auto;padding:14px 18px 20px;display:flex;flex-direction:column;gap:10px}
.drawer .foot{display:flex;gap:8px;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.card{border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;background:var(--surface);min-width:0}
.card:hover{border-color:var(--accent)}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card .t{font-weight:700}
.card .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:24px 8px;border:1px dashed var(--line);border-radius:10px}

form.ed{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12.5px;font-weight:700;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 10px;width:100%}
.fld textarea{min-height:84px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1.4fr 1.2fr;gap:6px}
.hint{font-size:12px;color:var(--muted);margin:0}
.chlist{display:flex;flex-wrap:wrap;gap:6px}
.chlist .tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding-block:2px;padding-inline:10px 4px}
.chlist .tag button{border:0;background:var(--sunk);border-radius:50%;width:20px;height:20px;line-height:1;color:var(--muted)}
.addch{display:flex;gap:6px}
.addch input{flex:1}

.banner{background:var(--ipo-soft);border:1px solid var(--ipo);border-radius:10px;padding:8px 12px;margin-block:8px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:9px;z-index:40;font-size:13px}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(var(--slide,-24px));opacity:.4}to{transform:none;opacity:1}}}

/* ---------- workflow: stages, flags, cards, board, detail tabs, dashboard ---------- */
.st.s-brief{color:var(--st-brief)} .st.s-review{color:var(--st-review)}
.flags{display:inline-flex;flex-wrap:wrap;gap:4px}
.fl{display:inline-flex;align-items:center;font-size:11px;font-weight:700;border-radius:5px;padding:0 6px;white-space:nowrap;line-height:1.75;border:1px solid transparent}
.fl.late{background:var(--danger);color:var(--surface)}
.fl.soon{background:color-mix(in srgb,var(--warn) 15%,var(--surface));color:var(--warn)}
.fl.unconf{border:1px dashed var(--info);color:var(--info)}
.fl.block,.fl.hi{background:var(--danger-soft);color:var(--danger)}
.fl.perf{background:color-mix(in srgb,var(--ok) 13%,var(--surface));color:var(--ok)}
.chip.late{background:var(--danger-soft);outline:1.5px solid var(--danger);outline-offset:-1.5px}
.chip.pub::before{content:"✓";color:var(--ok);font-weight:800;margin-inline-end:4px}

.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;width:210px;max-width:100%}
.search:focus{border-color:var(--accent);outline:none}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:inherit;text-align:start}
.prog{display:inline-flex;align-items:center;gap:6px}
.prog .bar{width:84px;height:7px;border-radius:99px;background:var(--surface);overflow:hidden;border:1px solid var(--line)}
.prog .bar i{display:block;height:100%;background:var(--ok)}
.alerts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-block:0 12px;font-size:12.5px}
.alerts:empty{display:none}
.alerts .lbl{color:var(--muted);font-weight:700;margin-inline-end:2px}
.al{--c:var(--muted);display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));background:color-mix(in srgb,var(--c) 7%,var(--surface));border-radius:99px;padding:3px 12px}
.al::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.al b{color:var(--c)}
button.al:hover{border-color:var(--c)}
.al.okay{color:var(--muted)}

.copen{border:0;background:none;margin:0;width:100%;text-align:start;display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:10px;min-width:0;color:inherit}
.copen:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:6px 8px;padding:0 12px 10px;flex-wrap:wrap;margin-top:-4px}
.card .hint{font-size:12px}
.btn.sm{padding:2px 10px;font-size:12px;border-radius:7px}
.btn.go{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line));font-weight:700}
.btn.go:hover{background:color-mix(in srgb,var(--ok) 10%,var(--surface));border-color:var(--ok)}

.boardhint{font-size:12px;color:var(--muted);margin:0 0 10px}
.board{display:grid;grid-template-columns:repeat(6,minmax(188px,1fr));gap:10px;overflow-x:auto;padding-bottom:8px;align-items:start}
.bcol{--c:var(--idle);background:var(--sunk);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;display:flex;flex-direction:column;min-width:0;min-height:140px}
.bcol header{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px}
.bcol header .n{font-size:12px;font-weight:700;color:var(--muted)}
.bcards{display:flex;flex-direction:column;gap:8px;padding:0 8px 8px}
.bcol.drop{background:color-mix(in srgb,var(--c) 10%,var(--sunk));outline:2px dashed var(--c);outline-offset:-3px}
.bcol .none{font-size:12px;color:var(--muted);text-align:center;padding:16px 4px;border:1px dashed var(--line);border-radius:9px}
.bcard .copen{padding:8px 10px;gap:3px}
.bcard .t{font-size:13px;line-height:1.55}
.bcard .meta{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:11.5px;color:var(--muted)}
.bcard .cfoot{padding:0 10px 8px}
.bcard .cd,.dtable .cd{display:inline-flex;gap:3px}
.dtable .cd{vertical-align:-3px;margin-inline-start:4px}
.bcard[draggable="true"]{cursor:grab}
.bcard.dragging{opacity:.4}

.steps{display:flex;flex-wrap:wrap;gap:4px}
.stp{--c:var(--idle);flex:1 1 0;min-width:66px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 3px 4px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.35;white-space:nowrap}
.stp i{font-style:normal;width:19px;height:19px;border-radius:50%;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800}
.stp:hover{border-color:var(--c)}
.stp.done{color:var(--c)}
.stp.done i,.stp.cur i{background:var(--c);border-color:var(--c);color:var(--surface)}
.stp.cur{color:var(--c);border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface));font-weight:800}
#edFlags:not(:empty){margin-top:6px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-top:2px}
.tabs button{border:0;background:none;padding:7px 10px 8px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;border-radius:6px 6px 0 0}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:800;border-bottom-color:var(--accent)}
.tabs .cnt{font-size:10.5px;background:var(--sunk);border:1px solid var(--line);border-radius:99px;padding:0 6px;font-weight:700;color:var(--muted);line-height:1.6}
.tabs .cnt.full{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok);border-color:transparent}
.tpanel{display:flex;flex-direction:column;gap:12px}
.fld textarea.short{min-height:58px}
.lblrow{display:flex;align-items:center;gap:8px}
.lblrow label{flex:1}
.three.eq{grid-template-columns:repeat(3,minmax(0,1fr))}
.assets{display:flex;flex-direction:column;gap:6px}
.assets:empty{display:none}
.asset{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.5fr) auto auto;gap:4px;align-items:center}
.asset input{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:6px 8px;width:100%;min-width:0}
.asset input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.asset .btn{padding:3px 8px}
.ptable{width:100%;border-collapse:collapse;font-size:12.5px}
.ptable th{font-weight:700;color:var(--muted);text-align:start;padding:0 4px 6px;font-size:12px}
.ptable td{padding:3px 4px}
.ptable input{border:1px solid var(--line);background:var(--sunk);border-radius:7px;padding:5px 6px;width:100%;min-width:56px;direction:ltr;text-align:center}
.ptable input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.ptable tfoot td{font-weight:800;border-top:1px solid var(--line);padding-top:7px;text-align:center}
.ptable tfoot td:first-child{text-align:start}

.kpi.good .v{color:var(--ok)} .kpi.bad .v{color:var(--danger)}
.panel h4{margin:14px 0 8px;font-size:12.5px;font-weight:800;color:var(--muted)}
.panel.brief p{margin:6px 0 0}
.dh2{font-size:17px;font-weight:800;margin:24px 0 10px}
.stagebar{display:flex;gap:2px;height:16px;margin-block:4px 10px}
.stagebar i{display:block;height:100%;min-width:3px}
.stagebar i:first-child{border-start-start-radius:5px;border-end-start-radius:5px}
.stagebar i:last-child{border-start-end-radius:5px;border-end-end-radius:5px}
.slegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px}
.tscroll{overflow-x:auto}
.dtable{width:100%;border-collapse:collapse;font-size:12.5px}
.dtable th{font-weight:700;color:var(--muted);text-align:start;padding:6px 8px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}
.dtable td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.dtable tr:last-child td{border-bottom:0}
.dtable td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.dtable td.bad{color:var(--danger);font-weight:800}
.dtable .mini{display:inline-block;height:6px;border-radius:99px;vertical-align:middle;margin-inline-start:8px;min-width:2px}
.dtable .linkbtn{text-decoration:none;color:var(--ink);font-weight:500}
.dtable .linkbtn:hover{color:var(--accent);text-decoration:underline}
.targets{display:flex;flex-direction:column;gap:12px}
.target{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.target .bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.target .bar i{display:block;height:100%;background:var(--ok)}
.drawer.still{animation:none}
@media (max-width:700px){.asset{grid-template-columns:minmax(0,1fr) auto auto}.asset .aT{grid-column:1/-1}}
:root[dir="ltr"]{--slide:24px}
.ipo-card .acts{display:flex;flex-direction:column;gap:6px}
.langbtn{justify-content:center;font-size:12.5px;padding-block:3px}
.filebar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;padding-block:10px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.filebar .fname{font-weight:700;color:var(--ink)}
.filebar .acts{display:flex;flex-wrap:wrap;gap:6px}
.savestate{color:var(--ok);font-weight:500}
.savestate::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-inline-end:6px;vertical-align:middle}
.savestate.dirty{color:var(--warn);font-weight:700}
.banner .btn{margin-inline-start:6px}
.auto{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink);padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;user-select:none}
.auto input{margin:0;accent-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="filebar">
    <div><span class="fname" id="fileName"></span> · <span class="savestate" id="saveState"></span></div>
    <div class="acts">
      <label class="auto" id="autoWrap" data-i18n-title="autoTip"><input type="checkbox" id="autoChk"> <span data-i18n="autosave"></span></label>
      <button class="btn" type="button" id="resumeBtn" hidden></button>
      <button class="btn primary" type="button" id="saveBtn" title="Ctrl+S" data-i18n="save"></button>
      <button class="btn" type="button" id="saveAsBtn" data-i18n="saveAs"></button>
      <button class="btn" type="button" id="csvBtn" data-i18n="csv"></button>
      <button class="btn" type="button" id="importBtn" data-i18n="import" data-i18n-title="importTip"></button>
      <input type="file" id="importFile" accept=".html,.htm,.json" hidden>
    </div>
  </div>
  <header class="top">
    <div class="brand">
      <input id="campSub" class="sub-input" maxlength="120" data-i18n-ph="subPh" data-i18n-aria="subAria">
      <input id="campTitle" class="title-input" maxlength="80" data-i18n-ph="titlePh" data-i18n-aria="titleAria">
    </div>
    <div class="ipo-card">
      <div>
        <div class="lbl" id="evLbl"></div>
        <div class="date" id="ipoDate">—</div>
      </div>
      <div class="big num" id="ipoCount">—</div>
      <div class="acts">
        <button class="btn" id="openSettings" type="button" data-i18n="settings"></button>
        <button class="btn langbtn" id="langBtn" type="button" data-i18n-title="langAria"></button>
      </div>
    </div>
  </header>

  <div id="banner"></div>

  <div class="toolbar">
    <div class="seg" role="group" data-i18n-aria="viewsAria">
      <button type="button" id="vCal" aria-pressed="true" data-i18n="vCal"></button>
      <button type="button" id="vRoad" aria-pressed="false" data-i18n="vRoad"></button>
      <button type="button" id="vBoard" aria-pressed="false" data-i18n="vBoard"></button>
      <button type="button" id="vChart" aria-pressed="false" data-i18n="vChart"></button>
    </div>
    <div class="filters">
      <input type="search" class="search" id="fQ" data-i18n-ph="searchPh" data-i18n-aria="searchAria">
      <select class="f" id="fCh" data-i18n-aria="fChAria"></select>
      <select class="f" id="fSt" data-i18n-aria="fStAria"></select>
      <select class="f" id="fPe" data-i18n-aria="fPeAria"></select>
      <button class="btn" type="button" id="manageCh" data-i18n="manageCh"></button>
      <button class="btn" type="button" id="managePe" data-i18n="managePe"></button>
      <button class="btn" type="button" id="manageTy" data-i18n="manageTy"></button>
      <button class="btn danger" type="button" id="resetBtn" data-i18n="reset"></button>
      <button class="btn primary" type="button" id="addBtn" data-i18n="add"></button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="alerts" id="alerts"></div>

  <main id="main"></main>
</div>

<div id="drawerRoot"></div>
<div id="modalRoot"></div>
<div class="tip" id="tip" hidden></div>
<div id="toastRoot"></div>

function builtinLogo(name){
  const n=String(name||"").toLowerCase(); if(!n) return null;
  const toks=n.split(/[\s\/،,()\-_.|+]+/).filter(Boolean);
  return LOGOS.find(l=>(l.t&&l.t.some(t=>toks.includes(t)))||(l.s&&l.s.some(x=>n.includes(x))))||null;
}
function iconFor(name,meta){
  meta=meta||{};
  if(meta.img) return '<span class="lg"><img src="'+esc(meta.img)+'" alt=""></span>';
  const b=builtinLogo(name);
  if(b) return '<span class="lg"><svg viewBox="0 0 24 24" aria-hidden="true">'+b.svg+'</svg></span>';
  const ch=[...String(name||"?").trim()][0]||"?";
  return '<span class="lg ini" style="--c:'+(meta.color||"#8A949E")+'" aria-hidden="true">'+esc(ch)+'</span>';
}

const pcs=s=>S.lang==="fa"?s+"٪":s+"%";
const pct=(a,b)=>b?pcs(n1(a/b*100)):"—";
const fmtN=n=>{const s=Math.round(n).toLocaleString("en-US");return S.lang==="fa"?nd(s.replace(/,/g,"٬")):s;};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- calendars: Solar Hijri (via Intl) and Gregorian; a day is a UTC day number ---------- */
const MONTHS={
  jalali:{fa:["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"],
          en:["Farvardin","Ordibehesht","Khordad","Tir","Mordad","Shahrivar","Mehr","Aban","Azar","Dey","Bahman","Esfand"]},
  gregorian:{fa:["ژانویه","فوریه","مارس","آوریل","مه","ژوئن","ژوئیه","اوت","سپتامبر","اکتبر","نوامبر","دسامبر"],
          en:["January","February","March","April","May","June","July","August","September","October","November","December"]}
};
const WD_NAMES={fa:["یکشنبه","دوشنبه","سه‌شنبه","چهارشنبه","پنجشنبه","جمعه","شنبه"],en:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"]};
const WD_SHORT={fa:["ی","د","س","چ","پ","ج","ش"],en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]};
// week start and weekend (0 = Sunday): Iran's week starts Saturday with Thursday/Friday off; the Gregorian week starts Monday
const CALS={jalali:{weekStart:6,rest:[4,5]},gregorian:{weekStart:1,rest:[6,0]}};
const fmtJ=new Intl.DateTimeFormat("en-US-u-ca-persian-nu-latn",{timeZone:"UTC",year:"numeric",month:"numeric",day:"numeric"});
const jCache=new Map();
function jalaliOf(dn){
  let r=jCache.get(dn); if(r) return r;
  const p={}; for(const x of fmtJ.formatToParts(new Date(dn*DAY))) p[x.type]=x.value;
  r={y:parseInt(p.year,10),m:+p.month,d:+p.day}; jCache.set(dn,r); return r;
}
const mo=m=>m<=6?(m-1)*31:186+(m-7)*30;
function fromJalali(y,m,d){
  let dn=Math.floor(Date.UTC(y+621,2,21)/DAY)+mo(m)+d-1;
  for(let i=0;i<6;i++){const j=jalaliOf(dn);const delta=(y-j.y)*365+mo(m)-mo(j.m)+d-j.d;if(!delta)return dn;dn+=delta;}
  return dn;
}
const gregOf=dn=>{const t=new Date(dn*DAY);return {y:t.getUTCFullYear(),m:t.getUTCMonth()+1,d:t.getUTCDate()};};
const fromGreg=(y,m,d)=>Math.round(Date.UTC(y,m-1,d)/DAY);
const toCal=dn=>S.cal==="jalali"?jalaliOf(dn):gregOf(dn);
const fromCal=(y,m,d)=>S.cal==="jalali"?fromJalali(y,m,d):fromGreg(y,m,d);
const monthLen=(y,m)=>(m===12?fromCal(y+1,1,1):fromCal(y,m+1,1))-fromCal(y,m,1);
const monthName=m=>MONTHS[S.cal][S.lang][m-1];
const REST=()=>CALS[S.cal].rest;
const wd=dn=>(dn+4)%7;                                        // 0 = Sunday
const colOf=dn=>(wd(dn)-CALS[S.cal].weekStart+7)%7;           // column in the month grid
const isoToDn=s=>Math.round(Date.parse(s+"T00:00:00Z")/DAY);
const dnToIso=dn=>new Date(dn*DAY).toISOString().slice(0,10);
const todayDn=()=>{const n=new Date();return Math.floor((n.getTime()-n.getTimezoneOffset()*6e4)/DAY);}; // the viewer's local date
const dStr=dn=>{const j=toCal(dn);return nd(j.d)+" "+monthName(j.m)+" "+nd(j.y);};
const dFull=dn=>WD_NAMES[S.lang][wd(dn)]+(S.lang==="en"?", ":" ")+dStr(dn);
const dShort=dn=>{const j=toCal(dn),m=monthName(j.m);return nd(j.d)+" "+(S.lang==="en"?m.slice(0,3):m);};
function dLabel(off){ if(off===0) return esc(dayName()); return '<span class="ltr num">D'+(off>0?"+":"−")+Math.abs(off)+'</span>'; }
const relText=o=>o===0?esc(dayName()):o<0?L("daysBefore",-o,esc(EV())):L("daysAfter",o,esc(EV()));

/* ---------- state ---------- */
const S={ipo:null,lang:LANG0,calPref:null,cal:"jalali",channels:[],items:new Map(),view:"cal",my:null,mm:null,myCal:null,fCh:"",fSt:"*",db:null,readOnly:false,people:[],
  title:"",subtitle:"",eventName:"",fPe:"",channelMeta:{},types:[],pillars:[],campGoal:"",campAudience:"",targets:{},q:"",ctx:null,edTab:"main",still:false,chromeLang:null};
const EV=()=>S.eventName||DEF().event;
const dayName=()=>L("dayName",EV());
function settingsObj(){return {ipoDate:S.ipo==null?null:dnToIso(S.ipo),lang:S.lang,calendar:S.calPref,channels:S.channels.slice(),channelMeta:{...S.channelMeta},types:S.types.slice(),people:S.people.slice(),
  title:S.title,subtitle:S.subtitle,eventName:S.eventName,pillars:S.pillars.slice(),campGoal:S.campGoal,campAudience:S.campAudience,targets:{...S.targets}};}
function applySettings(d){
  S.lang=LANGS.includes(d.lang)?d.lang:LANG0;
  S.calPref=CALS[d.calendar]?d.calendar:null;
  S.cal=S.calPref||(S.lang==="fa"?"jalali":"gregorian");

  S.channels=Array.isArray(d.channels)&&d.channels.length?d.channels.slice():DEF().channels.slice();
  S.people=Array.isArray(d.people)?d.people.slice():[];

  S.title=d.title||""; S.subtitle=d.subtitle||""; S.eventName=d.eventName||"";

applySettings({});
try{const v=localStorage.getItem("roadmap-view");if(["road","cal","chart","board"].includes(v))S.view=v;}catch(e){}

const ipoDn=()=>S.ipo??todayDn();
const itemChs=it=>Array.isArray(it.channels)&&it.channels.length?it.channels:(it.channel?[it.channel]:[]);
const chColor=name=>{const m=S.channelMeta[name];if(m&&m.color)return m.color;const b=builtinLogo(name);if(b)return b.c;const i=S.channels.indexOf(name);return i<0?"#8A949E":PALETTE[i%PALETTE.length];};
const chIcon=name=>iconFor(name,{...(S.channelMeta[name]||{}),color:chColor(name)});
const stMeta=k=>STAGES[Math.max(0,sRank(k))];
const stLabel=k=>L("st_"+stMeta(k)[0]);
const stPill=k=>'<span class="st '+stMeta(k)[1]+'">'+stLabel(k)+'</span>';
const chTag=n=>'<span class="ch">'+chIcon(n)+esc(n||L("noChannel"))+'</span>';
const chTags=it=>{const c=itemChs(it);return '<span class="chs">'+(c.length?c.map(chTag).join(""):chTag(""))+'</span>';};
const isUrl=u=>/^https?:\/\/\S/i.test(String(u||"").trim());
function parseNum(s){
  s=String(s??"").replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632).replace(/[,٬،\s]/g,"");
  if(!s) return null;
  const n=Number(s); return Number.isFinite(n)&&n>=0?Math.round(n):null;
}
/* results entered per channel after publishing: [{ch, v:views, e:engagement, c:clicks}]
   (an array, so a db update replaces it whole; an older {channel:{…}} map is still read) */
function perfOf(it){
  const p=it&&it.perf, list=Array.isArray(p)?p:p&&typeof p==="object"?Object.entries(p).map(([ch,m])=>({...m,ch})):[], out=[];
  for(const m of list){if(!m||!m.ch)continue;const r={ch:String(m.ch),v:+m.v||0,e:+m.e||0,c:+m.c||0};if(r.v||r.e||r.c)out.push(r);}
  return out;
}
/* what needs attention; the deadline is `lead` days before publishing, or the publish day itself */
function flagsOf(it,today){
  if(today==null) today=todayDn();
  const k=stageOf(it), pub=ipoDn()+it.offset, due=Number.isFinite(it.lead)?pub-it.lead:null, end=due??pub;
  const f={stage:k,pub,due,left:end-today};
  if(sRank(k)<APPROVED){f.open=true;if(today>end)f.late=true;else if(end-today<=2)f.soon=true;}
  if(k==="approved"&&today>pub) f.unconf=true;
  if(k!=="published"&&String(it.blocker||"").trim()) f.block=true;
  if(it.priority==="high"&&k!=="published") f.hi=true;
  if(perfOf(it).length) f.perf=true;
  return f;
}
function flagHtml(f,noPerf){
  let h="";
  if(f.late) h+='<span class="fl late">'+L("fl_late")+'</span>';
  else if(f.soon) h+='<span class="fl soon">'+(f.left<=0?L("fl_dueToday"):f.left===1?L("fl_dueTomorrow"):L("fl_dueIn",f.left))+'</span>';
  if(f.unconf) h+='<span class="fl unconf">'+L("fl_unconf")+'</span>';
  if(f.block) h+='<span class="fl block">'+L("fl_block")+'</span>';
  if(f.hi) h+='<span class="fl hi">'+L("fl_hi")+'</span>';
  if(f.perf&&!noPerf) h+='<span class="fl perf">'+L("fl_perf")+'</span>';
  return h?'<span class="flags">'+h+'</span>':"";
}
const norm=s=>String(s||"").replace(/ي/g,"ی").replace(/ك/g,"ک").replace(/[‌‎‏]/g," ").replace(/\s+/g," ").toLowerCase();
const hay=it=>norm([it.title,it.notes,it.caption,it.overlay,it.hook,it.cta,it.audience,it.owner,it.type,it.pillar,goalLabel(it.goal),it.blocker,it.ref,itemChs(it).join(" ")].join(" "));

function visibleItems(){
  const out=[], today=todayDn(), q=norm(S.q).trim();
  for(const [id,it] of S.items){
    if(S.fCh && !itemChs(it).includes(S.fCh)) continue;
    if(S.fSt!=="*" && (SKEYS.includes(S.fSt)?stageOf(it)!==S.fSt:!flagsOf(it,today)[S.fSt])) continue;
    if(S.fPe && (S.fPe==="__none"?!!it.owner:it.owner!==S.fPe)) continue;
    if(q && !hay(it).includes(q)) continue;
    out.push({id,...it});
  }
  return out.sort((a,b)=>a.offset-b.offset||(a.time||"99").localeCompare(b.time||"99")||(a.title||"").localeCompare(b.title||""));
}

/* ---------- rendering ---------- */
/* the page chrome: direction, language and the fixed labels marked data-i18n / -ph / -aria / -title */
function applyChrome(){
  S.chromeLang=S.lang;
  const root=document.documentElement; root.lang=S.lang; root.dir=S.lang==="fa"?"rtl":"ltr";
  document.querySelectorAll("[data-i18n]").forEach(e=>{e.textContent=L(e.dataset.i18n);});
  document.querySelectorAll("[data-i18n-ph]").forEach(e=>{e.placeholder=L(e.dataset.i18nPh);});
  document.querySelectorAll("[data-i18n-aria]").forEach(e=>{e.setAttribute("aria-label",L(e.dataset.i18nAria));});
  document.querySelectorAll("[data-i18n-title]").forEach(e=>{e.title=L(e.dataset.i18nTitle);});
  const other=LANGS.find(l=>l!==S.lang); $("langBtn").textContent=I18N[other].langName; $("langBtn").lang=other; $("langBtn").dataset.lang=other;
  renderFilters();
  if(typeof renderSaveState==="function") renderSaveState();
}
function renderHeader(){

  $("ipoDate").textContent=S.ipo==null?L("notSet"):dFull(ipo);

  if(document.activeElement!==$("campSub")) $("campSub").value=S.subtitle;
  document.title=S.title||L("appName");
  $("ipoCount").innerHTML=S.ipo==null?"—":diff>0?nd(diff)+'<span class="lbl">'+L("daysLeft",diff)+'</span>':diff===0?L("today"):nd(-diff)+'<span class="lbl">'+L("daysAgo",-diff)+'</span>';
}
function renderFilters(){
  if(S.fCh&&!S.channels.includes(S.fCh)) S.fCh="";
  $("fCh").innerHTML='<option value="">'+L("allChannels")+'</option>'+S.channels.map(c=>'<option'+(c===S.fCh?" selected":"")+'>'+esc(c)+'</option>').join("");
  if(S.fSt!=="*"&&!SKEYS.includes(S.fSt)&&!ATTN.includes(S.fSt)) S.fSt="*";
  $("fSt").innerHTML='<option value="*">'+L("allStages")+'</option>'+SKEYS.map(k=>'<option value="'+k+'">'+L("st_"+k)+'</option>').join("")+

  if(S.fPe&&S.fPe!=="__none"&&!S.people.includes(S.fPe)) S.fPe="";
  $("fPe").innerHTML='<option value="">'+L("allPeople")+'</option><option value="__none">'+L("noOwner")+'</option>'+S.people.map(p=>'<option>'+esc(p)+'</option>').join("");
  $("fPe").value=S.fPe;
  if(document.activeElement!==$("fQ")) $("fQ").value=S.q;
}
/* the "needs attention" buttons under the counters; each opens its list (the approval queue is one of them) */
const ALERTS=[
  ["late","at_late","var(--danger)",f=>f.late],
  ["soon","at_soon","var(--warn)",f=>f.soon],
  ["review","st_review","var(--st-review)",f=>f.stage==="review"],
  ["block","at_block","var(--danger)",f=>f.block],
  ["unconf","at_unconf","var(--info)",f=>f.unconf]
];
function renderStats(){
  const all=[...S.items.values()], today=todayDn();
  const days=new Set(all.map(i=>i.offset)).size;
  const cnt=new Map(); for(const it of all){const k=stageOf(it);cnt.set(k,(cnt.get(k)||0)+1);}
  const nPub=cnt.get("published")||0, p=all.length?Math.round(nPub/all.length*100):0;
  const filtered=S.fCh||S.fSt!=="*"||S.fPe||S.q.trim(), nVis=filtered?visibleItems().length:0;
  $("stats").innerHTML='<span><b class="num">'+nd(all.length)+'</b> '+L("items",all.length)+'</span><span><b class="num">'+nd(days)+'</b> '+L("plannedDays",days)+'</span>'+
    SKEYS.filter(k=>cnt.get(k)).map(k=>'<span>'+L("st_"+k)+': <b class="num">'+nd(cnt.get(k))+'</b></span>').join("")+
    (all.length?'<span class="prog"><span class="bar" aria-hidden="true"><i style="width:'+p+'%"></i></span><span><b class="num">'+pcs(nd(p))+'</b> '+L("pctPublished")+'</span></span>':"")+
    (filtered?'<span>'+L("filtered")+' <b class="num">'+nd(nVis)+'</b> '+L("matches",nVis)+' · <button type="button" class="linkbtn" data-clrf="1">'+L("clearFilters")+'</button></span>':"");
  const fl=all.map(it=>flagsOf(it,today)), al=ALERTS.map(a=>[a,fl.filter(a[3]).length]).filter(x=>x[1]);
  $("alerts").innerHTML=!all.length?"":al.length?'<span class="lbl">'+L("attentionColon")+'</span>'+al.map(([a,n])=>'<button type="button" class="al" data-alert="'+a[0]+'" style="--c:'+a[2]+'"><b class="num">'+nd(n)+'</b>'+L(a[1])+'</button>').join(""):
    '<span class="al okay" style="--c:var(--ok)">'+L("allGood")+'</span>';
}
function render(){
  if(S.chromeLang!==S.lang) applyChrome();

  for(const [b,v] of [["vCal","cal"],["vRoad","road"],["vBoard","board"],["vChart","chart"]]) $(b).setAttribute("aria-pressed",S.view===v);

function showMonthOf(dn){const j=toCal(dn);S.my=j.y;S.mm=j.m;S.myCal=S.cal;}

function renderCal(){
  if(S.my==null||S.myCal!==S.cal) showMonthOf(ipoDn());
  const first=fromCal(S.my,S.mm,1), len=monthLen(S.my,S.mm);
  const start=first-colOf(first);
  const rows=Math.ceil((colOf(first)+len)/7);
  const ipo=ipoDn(), today=todayDn(), rest=REST();
  const restCls=w=>w===rest[0]?" thu":w===rest[1]?" fri":"";
  const byDay=new Map();
  for(const it of visibleItems()){const dn=ipo+it.offset;(byDay.get(dn)||byDay.set(dn,[]).get(dn)).push(it);}
  let h='<div class="calhead"><h2>'+monthName(S.mm)+' '+nd(S.my)+'</h2><div class="calnav">'+
    '<button class="btn" type="button" data-nav="1">'+L("prevMonth")+'</button>'+
    '<button class="btn" type="button" data-nav="0">'+L("eventMonth",esc(EV()))+'</button>'+
    '<button class="btn" type="button" data-nav="t">'+L("today")+'</button>'+
    '<button class="btn" type="button" data-nav="-1">'+L("nextMonth")+'</button></div></div><div class="cal">';
  for(let i=0;i<7;i++){const w=(CALS[S.cal].weekStart+i)%7;h+='<div class="wd'+restCls(w)+'">'+WD_SHORT[S.lang][w]+'</div>';}
  for(let i=0;i<rows*7;i++){
    const dn=start+i, j=toCal(dn), off=dn-ipo, list=byDay.get(dn)||[];
    const cls="cell"+(j.m!==S.mm?" out":"")+(dn===today?" today":"")+restCls(wd(dn))+(off===0?" ipo":"");
    h+='<button type="button" class="'+cls+'" data-day="'+dn+'" aria-label="'+esc(L("cellAria",dFull(dn),list.length))+'">'+
      '<span class="dh"><span class="dn num">'+nd(j.d)+'</span><span class="dd">'+(Math.abs(off)<=60?dLabel(off):"")+'</span></span>';
    list.slice(0,3).forEach(it=>{const c=itemChs(it),f=flagsOf(it,today),k=f.stage;h+='<span class="chip'+(f.late?" late":f.open?" pend":"")+(k==="published"?" pub":"")+'" style="--c:'+chColor(c[0])+'" title="'+esc(c.join(L("sep"))+" · "+it.title+" · "+stLabel(k))+'">'+(c.length?'<span class="cd">'+c.map(chIcon).join("")+'</span>':"")+(it.time?'<span class="num">'+nd(it.time)+'</span> ':"")+esc(it.title||L("untitled"))+'</span>';});
    if(list.length>3) h+='<span class="more">'+L("moreN",list.length-3)+'</span>';
    if(list.length) h+='<span class="dots">'+list.map(it=>'<i style="--c:'+chColor(itemChs(it)[0])+'"></i>').join("")+'</span>';
    h+='</button>';
  }
  h+='</div><div class="legend"><span><i style="background:var(--thu)"></i>'+WD_NAMES[S.lang][rest[0]]+'</span><span><i style="background:var(--fri)"></i>'+WD_NAMES[S.lang][rest[1]]+' ('+L("holiday")+')</span><span><i style="background:var(--ipo-soft);border-color:var(--ipo)"></i>'+esc(dayName())+'</span>'+
    '<span><i style="background:transparent;border:1px dashed var(--warn)"></i>'+L("at_open")+'</span><span><i style="background:var(--danger-soft);border-color:var(--danger)"></i>'+L("at_late")+'</span><span><b style="color:var(--ok)">✓</b> '+L("lgPublished")+'</span>'+
    '<span>'+L("calHint")+'</span></div>';

function renderRoad(){
  const items=visibleItems(), ipo=ipoDn(), today=todayDn(), rest=REST();
  const groups=new Map();
  for(const it of items)(groups.get(it.offset)||groups.set(it.offset,[]).get(it.offset)).push(it);
  if(!groups.has(0)) groups.set(0,[]);
  const offs=[...groups.keys()].sort((a,b)=>a-b);
  const phases=[[L("before",EV()),L("ph_before"),o=>o<0],[dayName(),L("ph_day"),o=>o===0],[L("after",EV()),L("ph_after"),o=>o>0]];
  let h="";
  for(const [name,sub,test] of phases){
    const ps=offs.filter(test); if(!ps.length) continue;
    const n=ps.reduce((a,o)=>a+groups.get(o).length,0);
    h+='<div class="phase"><h3>'+esc(name)+'</h3><span>'+sub+' · '+nd(n)+' '+L("items",n)+'</span></div>';
    for(const o of ps){
      const dn=ipo+o, list=groups.get(o), w=wd(dn);
      h+='<section class="day'+(o===0?" ipo":"")+(w===rest[0]?" thu":w===rest[1]?" fri":"")+'"><div class="when"><span class="dl">'+dLabel(o)+'</span><span class="full">'+dFull(dn)+(w===rest[1]?'<span class="offtag">'+L("holiday")+'</span>':"")+'</span></div><div class="rows">';
      for(const it of list){
        const f=flagsOf(it,today), na=Array.isArray(it.assets)?it.assets.length:0;
        h+='<button type="button" class="row" data-item="'+esc(it.id)+'">'+chTags(it)+
          '<span><span class="t">'+esc(it.title||L("untitled"))+'</span><span class="meta">'+(it.type?'<span>'+esc(it.type)+'</span>':"")+
          '<span>'+L("timeLbl")+' '+(it.time?'<span class="num">'+nd(it.time)+'</span>':"—")+'</span><span>'+L("ownerLbl")+' '+esc(it.owner||"—")+'</span>'+
          (f.due!=null&&f.open?'<span>'+L("dueLbl")+' '+dShort(f.due)+'</span>':"")+(na?'<span>'+L("nFiles",na)+'</span>':"")+(it.link?'<span>'+L("hasLink")+'</span>':"")+flagHtml(f)+'</span></span>'+
          '<span class="side">'+stPill(f.stage)+'</span></button>';
      }
      h+='<button type="button" class="addrow" data-add="'+dn+'">'+L("addHere")+'</button></div></section>';
    }
  }
  $("main").innerHTML=h||'<div class="empty">'+L("noMatch")+'</div>';
}

function closeDrawer(){$("drawerRoot").innerHTML="";S.ctx=null;}
function drawer(title,sub,body,foot){
  $("drawerRoot").innerHTML='<div class="scrim" data-close="1"></div><aside class="drawer'+(S.still?" still":"")+'" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><header><div><h2>'+title+'</h2>'+(sub?'<p>'+sub+'</p>':"")+'</div><button class="btn ghost" type="button" data-close="1" aria-label="'+L("close")+'">✕</button></header><div class="body">'+body+'</div>'+(foot?'<div class="foot">'+foot+'</div>':"")+'</aside>';
}
function cardFoot(it,f){
  const k=f.stage, nx=nextStage(k), fh=flagHtml(f);
  const adv=k==="published"?"":'<button class="btn sm go" type="button" data-adv="'+esc(it.id)+'" data-to="'+nx+'">'+L("adv_"+nx)+'</button>';
  return fh||adv?'<div class="cfoot">'+(fh||"<span></span>")+adv+'</div>':"";
}
function cardHtml(it,withDate){
  const f=flagsOf(it);
  const meta=(withDate?'<span>'+dShort(f.pub)+' · '+dLabel(it.offset)+'</span>':"")+'<span>'+esc(it.type||"—")+'</span><span>'+L("timeLbl")+' '+(it.time?nd(it.time):"—")+'</span><span>'+L("ownerLbl")+' '+esc(it.owner||"—")+'</span>'+(f.due!=null&&f.open?'<span>'+L("dueLbl")+' '+dShort(f.due)+'</span>':"");
  return '<div class="card"><button type="button" class="copen" data-item="'+esc(it.id)+'"><span class="top">'+chTags(it)+stPill(f.stage)+'</span><span class="t">'+esc(it.title||L("untitled"))+'</span><span class="meta">'+meta+'</span>'+(f.block?'<span class="hint">'+L("fl_block")+': '+esc(it.blocker)+'</span>':"")+'</button>'+cardFoot(it,f)+'</div>';
}
function openDay(dn){
  const off=dn-ipoDn();
  const list=[...S.items].map(([id,it])=>({id,...it})).filter(it=>it.offset===off).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"));
  const body=list.length?list.map(it=>cardHtml(it)).join(""):'<div class="empty">'+L("emptyDay")+'</div>';
  drawer(dFull(dn),dLabel(off)+(off===0?"":" · "+relText(off)),body,
    '<button class="btn primary" type="button" data-add="'+dn+'">'+L("addHere")+'</button><button class="btn" type="button" data-close="1">'+L("close")+'</button>');
  S.ctx={kind:"day",dn};
}
/* the lists behind the "needs attention" buttons: approval queue, late work, unconfirmed publishing… */
function openAlert(k){
  const a=ALERTS.find(x=>x[0]===k); if(!a) return;
  const today=todayDn();
  const list=[...S.items].map(([id,it])=>({id,...it})).filter(it=>a[3](flagsOf(it,today))).sort((x,y)=>x.offset-y.offset||(x.time||"99").localeCompare(y.time||"99"));
  const bulk={unconf:"published",review:"approved"}[k];
  drawer(esc(L(a[1])),esc(L("al_"+k+"_d")),list.length?list.map(it=>cardHtml(it,true)).join(""):'<div class="empty">'+L("noneLeft")+'</div>',
    (bulk&&list.length>1?'<button class="btn primary" type="button" id="bulkBtn">'+L("bulk_"+bulk)+' ('+nd(list.length)+')</button>':"")+'<button class="btn" type="button" data-close="1">'+L("close")+'</button>');
  S.ctx={kind:"alert",k};
  if(bulk&&list.length>1) armButton($("bulkBtn"),L("bulkConfirm",list.length),async()=>{
    let n=0; for(const it of list) if(await setStage(it.id,bulk,true)) n++;
    render(); refreshCtx(); toast(L("movedN",n,stLabel(bulk)));
  });
}
async function setStage(id,k,quiet){
  const it=S.items.get(id); if(!it) return false;
  const patch={stage:k,status:statusFor(k),updatedAt:new Date().toISOString()};
  S.items.set(id,{...it,...patch});
  const ok=await patchItem(id,patch);
  if(!ok) S.items.set(id,it);
  if(!quiet){render();refreshCtx();if(ok)toast(L("movedOne",it.title||L("untitled"),stLabel(k)));}
  return ok;
}
/* redraw an open day/attention list after its items changed, keeping the scroll position */
function refreshCtx(){
  const c=S.ctx; if(!c||!$("drawerRoot").innerHTML) return;
  const b=document.querySelector(".drawer .body"), y=b?b.scrollTop:0;
  S.still=true; try{c.kind==="day"?openDay(c.dn):openAlert(c.k);}finally{S.still=false;}
  const b2=document.querySelector(".drawer .body"); if(b2) b2.scrollTop=y;
}

function dayOpts(y,m,sel){const ml=monthLen(y,m);return Array.from({length:ml},(_,i)=>'<option value="'+(i+1)+'"'+(i+1===sel?" selected":"")+'>'+nd(i+1)+'</option>').join("");}
function dateSelects(dn){
  const j=toCal(dn);
  const d='<select id="edD" aria-label="'+L("dayAria")+'">'+dayOpts(j.y,j.m,j.d)+'</select>';
  const m='<select id="edM" aria-label="'+L("monthAria")+'">'+MONTHS[S.cal][S.lang].map((n,i)=>'<option value="'+(i+1)+'"'+(i+1===j.m?" selected":"")+'>'+n+'</option>').join("")+'</select>';
  let y='<select id="edY" aria-label="'+L("yearAria")+'">'; for(let k=j.y-1;k<=j.y+1;k++) y+='<option value="'+k+'"'+(k===j.y?" selected":"")+'>'+nd(k)+'</option>'; y+='</select>';
  return '<div class="three">'+d+m+y+'</div>';
}
function wireDateSelects(after){
  ["edY","edM"].forEach(k=>$(k).addEventListener("change",()=>{const y=+$("edY").value,m=+$("edM").value;$("edD").innerHTML=dayOpts(y,m,Math.min(+$("edD").value,monthLen(y,m)));after&&after();}));
  if(after) $("edD").addEventListener("change",after);
}
function relOpt(o){return '<option value="'+o+'">'+(o===0?esc(dayName())+" (D0)":"D"+(o>0?"+":"−")+Math.abs(o)+" · "+relText(o))+'</option>';}
function relSelect(off){
  const lo=Math.min(-90,off),hi=Math.max(90,off);let h='<select id="edRel">';
  for(let o=lo;o<=hi;o++) h+=relOpt(o);
  return h.replace('value="'+off+'"','value="'+off+'" selected')+'</select>';
}
function syncRel(o){const r=$("edRel");if(!r)return;if(![...r.options].some(x=>+x.value===o)){r.insertAdjacentHTML(o<0?"afterbegin":"beforeend",relOpt(o));}r.value=String(o);}
function setDate(dn){
  const j=toCal(dn),ys=$("edY");
  if(![...ys.options].some(x=>+x.value===j.y)) ys.insertAdjacentHTML("beforeend",'<option value="'+j.y+'">'+nd(j.y)+'</option>');
  ys.value=String(j.y);$("edM").value=String(j.m);
  $("edD").innerHTML=dayOpts(j.y,j.m,j.d);
}
function readDate(){
  const y=+$("edY").value, m=+$("edM").value;
  return fromCal(y,m,Math.min(+$("edD").value,monthLen(y,m)));
}

    '</div>'+
    /* brief */
    '<div class="tpanel" id="edPanel_brief" data-panel="brief" role="tabpanel" aria-labelledby="edTab_brief">'+

      '<div class="fld"><label for="edPillar">'+L("pillarLbl")+'</label><select id="edPillar">'+opts(piOpts,it&&it.pillar||"",L("choose"))+'<option value="__new">'+L("newPillar")+'</option></select><input id="edNewPi" maxlength="60" placeholder="'+esc(L("newPillarPh"))+'" hidden></div></div>'+

      '<div class="fld"><label for="edOver">'+L("overLbl")+'</label><textarea id="edOver" class="short" maxlength="1000">'+val("overlay")+'</textarea></div>'+
      '<div class="fld"><label>'+L("filesLbl")+'</label><div class="assets" id="edAssets"></div><div><button type="button" class="btn sm" id="edAddAsset">'+L("addFile")+'</button></div>'+
        '<p class="hint">'+L("filesHint")+'</p>'+
        '<datalist id="assetNames">'+L("assetNames").map(x=>'<option value="'+esc(x)+'">').join("")+'</datalist></div>'+
      '<div class="fld"><label for="edLink">'+L("linkLbl")+'</label><input id="edLink" dir="ltr" maxlength="1000" placeholder="https://" value="'+val("link")+'"></div>'+
      (it&&isUrl(it.link)?'<p class="hint"><a href="'+esc(it.link.trim())+'" target="_blank" rel="noopener">'+L("openLinkArrow")+'</a></p>':"")+
    '</div>'+

      '<p class="hint">'+L("perfIntro")+'</p><div id="edPerf"></div>'+
    '</div>'+
  '</form>';
  const foot='<span style="display:flex;gap:8px"><button class="btn primary" type="submit" form="edForm">'+(it?L("saveChanges"):L("addVerb"))+'</button><button class="btn" type="button" data-back="'+cur+'">'+L("cancel")+'</button></span>'+
    (it?'<button class="btn danger" type="button" id="delBtn">'+L("del")+'</button>':"");
  drawer(it?L("editTitle"):L("newTitle"),it?dFull(cur):"",body,foot);

  /* stage, deadline and flags */
  const leadVal=()=>$("edLead").value===""?null:+$("edLead").value;
  const drawFlags=()=>{
    const f=flagsOf({offset:readDate()-ipoDn(),stage,lead:leadVal(),blocker:$("edBlock").value,priority:$("edPrio").value});
    $("edFlags").innerHTML=flagHtml(f,true);
    $("edDue").textContent=f.due!=null?L("dueHintDue",dFull(f.due)):L("dueHintPub",dFull(f.pub));
  };
  const drawSteps=()=>{
    const r=sRank(stage);
    $("edSteps").innerHTML=STAGES.map(([k,,c],i)=>'<button type="button" class="stp'+(i<r?" done":i===r?" cur":"")+'" data-st="'+k+'" aria-pressed="'+(i===r)+'" style="--c:'+c+'"><i>'+(i<r?"✓":nd(i+1))+'</i>'+L("st_"+k)+'</button>').join("");
    drawFlags();
  };
  $("edSteps").addEventListener("click",e=>{const b=e.target.closest("[data-st]");if(!b)return;stage=b.dataset.st;drawSteps();const n=$("edSteps").querySelector('[data-st="'+stage+'"]');if(n)n.focus();});
  const upd=()=>{const dn2=readDate(),o=dn2-ipoDn();syncRel(o);$("edOff").innerHTML=dFull(dn2)+" · "+relText(o);drawFlags();};
  $("edRel").addEventListener("change",()=>{setDate(ipoDn()+(+$("edRel").value));upd();});
  wireDateSelects(upd);
  $("edLead").addEventListener("change",drawFlags);
  $("edPrio").addEventListener("change",drawFlags);
  $("edBlock").addEventListener("input",drawFlags);
  upd(); drawSteps();

  /* channels, new person / type / pillar */
  const selChs=()=>[...$("edChs").querySelectorAll('.pick[data-ch][aria-pressed="true"]')].map(b=>b.dataset.ch);
  $("edChs").addEventListener("click",e=>{
    const b=e.target.closest(".pick"); if(!b) return;

  const newOpt=(sel,inp)=>$(sel).addEventListener("change",()=>{const n=$(sel).value==="__new";$(inp).hidden=!n;if(n)$(inp).focus();});

  /* files and versions */

  $("edCopy").addEventListener("click",async()=>{
    const v=$("edCap").value; if(!v){toast(L("nothingToCopy"));return;}
    try{await navigator.clipboard.writeText(v);}catch(e){const x=$("edCap");x.focus();x.select();try{document.execCommand("copy");}catch(e2){}}

  /* results per channel */
  const perfDraft={}; if(it) for(const r of perfOf(it)) perfDraft[r.ch]={v:r.v,e:r.e,c:r.c};

    const T={v:0,e:0,c:0};

    const chs=selChs();
    if(!chs.length){$("edPerf").innerHTML='<p class="empty">'+L("perfPickCh")+'</p>';return;}

      chs.map(c=>{const m=perfDraft[c]||{};return '<tr><td>'+chTag(c)+'</td>'+METRICS.map(k=>'<td><input inputmode="numeric" data-pc="'+esc(c)+'" data-pk="'+k+'" aria-label="'+esc(L("metricIn",L("m_"+k),c))+'" value="'+esc(m[k]??"")+'"></td>').join("")+'</tr>';}).join("")+
      '</tbody>'+(chs.length>1?'<tfoot><tr><td>'+L("total")+'</td>'+METRICS.map(k=>'<td class="num" data-pt="'+k+'"></td>').join("")+'</tr></tfoot>':"")+'</table></div><p class="hint" id="edRate"></p>';
    perfCalc();
  };
  $("edPerf").addEventListener("input",e=>{const i=e.target.closest("[data-pc]");if(!i)return;(perfDraft[i.dataset.pc]||(perfDraft[i.dataset.pc]={}))[i.dataset.pk]=i.value;perfCalc();counts();});

  /* tabs and how complete each one is */
  const BRIEF=["edGoal","edPillar","edAud","edNotes","edHook","edCta"];
  function counts(){
    const nb=BRIEF.filter(k=>{const v=$(k).value.trim();return v&&v!=="__new";}).length, cb=$("edCnt_brief");
    cb.hidden=false; cb.textContent=nd(nb)+"/"+nd(BRIEF.length); cb.classList.toggle("full",nb===BRIEF.length);
    const na=assetRows().filter(a=>a.t||a.u).length, cp=$("edCnt_prod");
    cp.hidden=!na; cp.textContent=L("nFiles",na);
    const hasP=selChs().some(c=>perfDraft[c]&&METRICS.some(k=>parseNum(perfDraft[c][k]))), cf=$("edCnt_perf");
    cf.hidden=!hasP; cf.textContent="✓"; cf.classList.add("full");
    const n=$("edCap").value.length; $("edCapN").textContent=n?L("chars",n):"";
  }
  const showTab=tb=>{
    if(it) S.edTab=tb;

async function setLang(l){

  const from=DEFAULTS[S.lang], to=DEFAULTS[l], same=(a,b)=>a.length===b.length&&a.every((x,i)=>x===b[i]);
  const patch={lang:l};
  if(!S.items.size){

    if(same(S.types,from.types)) patch.types=to.types.slice();
    if(same(S.pillars,from.pillars)) patch.pillars=to.pillars.slice();
  }

  return saveSettings(patch);
}

function readImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
      const Z=96,c=document.createElement("canvas");c.width=c.height=Z;
      const x=c.getContext("2d"),r=Math.max(Z/im.width,Z/im.height),w=im.width*r,h=im.height*r;
      x.drawImage(im,(Z-w)/2,(Z-h)/2,w,h);
      let u=c.toDataURL("image/webp",.86); if(!u.startsWith("data:image/webp")) u=c.toDataURL("image/png");
      res(u);
    };im.src=fr.result;};
    fr.readAsDataURL(file);
  });
}

function niceStep(max){const raw=max/4;if(raw<=1)return 1;const p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p;}

/* results entered after publishing: totals, targets, and which channels, types, goals and pillars work best */
function perfSection(P){
  let h='<h2 class="dh2">'+L("perfH")+'</h2>';
  if(!P.length) return h+'<section class="panel"><p class="sub" style="margin:0">'+L("perfEmpty")+'</p></section>';
  const T={v:0,e:0,c:0}; for(const r of P){T.v+=r.v;T.e+=r.e;T.c+=r.c;}
  const measured=new Set(P.map(r=>r.it.id)).size;
  const kpi=(v,k,d)=>'<div class="kpi"><span class="v num">'+v+'</span><span class="k">'+k+'</span><span class="d">'+d+'</span></div>';
  h+='<div class="kpis">'+kpi(fmtN(T.v),L("m_v"),L("pk_viewsD",measured,P.length))+kpi(fmtN(T.e),L("m_e"),L("pk_erD",pct(T.e,T.v)))+
    kpi(fmtN(T.c),L("m_c"),L("pk_crD",pct(T.c,T.v)))+kpi(fmtN(T.v/P.length),L("pk_avg"),L("pk_avgD"))+'</div>';
  const tg=METRICS.filter(k=>S.targets[k]>0);
  if(tg.length) h+='<section class="panel"><h3>'+L("tgH")+'</h3><p class="sub">'+L("tgSub")+'</p><div class="targets">'+tg.map(k=>{
    const x=T[k]/S.targets[k];
    return '<div class="target"><span><b>'+L("m_"+k)+'</b>: '+L("tgOf",fmtN(T[k]),fmtN(S.targets[k]))+' <span class="hint">('+pcs(nd(Math.round(x*100)))+')</span></span><span class="bar"><i style="width:'+Math.min(100,x*100).toFixed(1)+'%"></i></span></div>';
  }).join("")+'</div></section>';
  const grp=key=>{const m=new Map();for(const r of P){const g=key(r);if(!g)continue;const x=m.get(g)||{v:0,e:0,n:0};x.v+=r.v;x.e+=r.e;x.n++;m.set(g,x);}
    return [...m].map(([g,x])=>({g,avg:x.v/x.n,er:x.v?x.e/x.v:0,n:x.n})).sort((a,b)=>b.avg-a.avg);};
  const bars=(rows,lab,col)=>hbars(rows.map(r=>({name:r.g,label:lab(r.g),value:r.avg,color:col(r.g),text:fmtN(r.avg)+'<small> · '+L("engShort",pcs(n1(r.er*100)))+'</small>',tip:L("barTip",fmtN(r.avg),r.n)})));
  const acc=()=>"var(--accent)", gGoal=grp(r=>r.it.goal?goalLabel(r.it.goal):""), gPi=grp(r=>r.it.pillar);
  h+='<div class="grid2"><section class="panel"><h3>'+L("pfChH")+'</h3><p class="sub">'+L("pfSub")+'</p>'+bars(grp(r=>r.ch),chTag,chColor)+'</section>'+
    '<section class="panel"><h3>'+L("pfTyH")+'</h3><p class="sub">'+L("pfSub")+'</p>'+bars(grp(r=>r.it.type||L("noType").replace(/—/g,"").trim()),esc,acc)+'</section></div>';
  const byIt=new Map(); for(const r of P){const x=byIt.get(r.it.id)||{it:r.it,v:0,e:0};x.v+=r.v;x.e+=r.e;byIt.set(r.it.id,x);}
  const top=[...byIt.values()].sort((a,b)=>b.v-a.v||b.e-a.e).slice(0,6);
  h+='<div class="grid2"><section class="panel"><h3>'+L("pfGpH")+'</h3><p class="sub">'+L("pfSub")+'</p>'+
    (gGoal.length||gPi.length?(gGoal.length?'<h4>'+L("goalH4")+'</h4>'+bars(gGoal,esc,acc):"")+(gPi.length?'<h4>'+L("pillarH4")+'</h4>'+bars(gPi,esc,acc):""):'<p class="hint">'+L("pfGpEmpty")+'</p>')+'</section>'+
    '<section class="panel"><h3>'+L("topH")+'</h3><p class="sub">'+L("topSub")+'</p><div class="tscroll"><table class="dtable"><thead><tr><th>'+L("th_item")+'</th><th>'+L("th_views")+'</th><th>'+L("th_er")+'</th></tr></thead><tbody>'+
    top.map(x=>'<tr><td><button type="button" class="linkbtn" data-item="'+esc(x.it.id)+'">'+esc(x.it.title||L("untitled"))+'</button><span class="cd">'+itemChs(x.it).map(chIcon).join("")+'</span></td><td class="n">'+fmtN(x.v)+'</td><td class="n">'+pct(x.e,x.v)+'</td></tr>').join("")+
    '</tbody></table></div></section></div>';
  return h;
}

/* ---------- persistence: this file + browser autosave ---------- */
function toast(msg){$("toastRoot").innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>$("toastRoot").innerHTML="",3600);}
function setBanner(msg){$("banner").innerHTML=msg?'<div class="banner">'+esc(msg)+'</div>':"";}
const EMB=(()=>{try{return JSON.parse($("roadmapData").textContent)||{};}catch(e){return {};}})();
const LS_KEY="roadmap:"+(EMB.docId||"")+":"+location.pathname;
let fileHandle=null, savedStamp=EMB.modifiedAt||"";
function snapshot(){
  const items={}; for(const [k,v] of S.items) items[k]=v;
  return {app:"content-roadmap",version:1,docId:EMB.docId||"default",...settingsObj(),items,modifiedAt:S.modifiedAt||""};
}
function autosave(){try{localStorage.setItem(LS_KEY,JSON.stringify(snapshot()));}catch(e){}}
function touch(){S.modifiedAt=new Date().toISOString();autosave();renderSaveState();scheduleAuto();}
const isDirty=()=>(S.modifiedAt||"")!==savedStamp;
const CAN_WRITE=typeof window.showSaveFilePicker==="function";
let autoOn=true, autoTimer=null, writing=false, pendingHandle=null;
try{autoOn=localStorage.getItem("roadmap-autosave")!=="0";}catch(e){}
function renderSaveState(){
  const el=$("saveState"), target=fileHandle?fileHandle.name:"";
  if(writing){el.textContent=L("fileSaving",target);el.className="savestate";}
  else if(isDirty()){
    el.textContent=autoOn&&fileHandle?L("dirtyAuto"):autoOn&&CAN_WRITE?L("dirtyNeedSave"):L("dirty");
    el.className="savestate dirty";
  }else{el.textContent=autoOn&&fileHandle?L("savedAuto",target):L("savedFile");el.className="savestate";}
  $("autoWrap").hidden=!CAN_WRITE; $("autoChk").checked=autoOn;
  $("resumeBtn").hidden=!(pendingHandle&&!fileHandle&&autoOn);
  if(pendingHandle) $("resumeBtn").textContent=L("resumeAuto",pendingHandle.name);
}
/* the chosen file is remembered per opened file, so reopening it needs one click to continue auto-saving */
const IDB={
  open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open("roadmap-files",1);r.onupgradeneeded=()=>r.result.createObjectStore("h");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));},
  async get(k){const d=await this.open();return new Promise((res,rej)=>{const q=d.transaction("h").objectStore("h").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});},
  async set(k,v){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction("h","readwrite");t.objectStore("h").put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
};
function useHandle(h){fileHandle=h;pendingHandle=null;try{IDB.set(LS_KEY,h).catch(()=>{});}catch(e){}}
async function writeHandle(){
  if(!fileHandle) return false;
  const stamp=S.modifiedAt||new Date().toISOString(); if(!S.modifiedAt) S.modifiedAt=stamp;
  writing=true; renderSaveState();
  try{
    const w=await fileHandle.createWritable(); await w.write(new Blob([buildHtml()],{type:"text/html"})); await w.close();
    writing=false; markSaved(stamp); return true;
  }catch(e){
    writing=false; pendingHandle=fileHandle; fileHandle=null; renderSaveState();
    toast(L("writeFail")); return false;
  }
}
function scheduleAuto(){
  if(!autoOn||!fileHandle) return;
  clearTimeout(autoTimer);
  autoTimer=setTimeout(async()=>{if(writing){scheduleAuto();return;} if(isDirty()) await writeHandle();},1200);
}
async function saveItem(id,data){S.items.set(id,data);touch();render();return true;}
async function deleteItem(id){S.items.delete(id);touch();render();return true;}
async function saveSettings(patch){applySettings({...settingsObj(),...patch});touch();renderFilters();render();return true;}
async function clearAllItems(){S.items.clear();touch();render();return true;}
async function patchItem(id,patch){const it=S.items.get(id);if(it)S.items.set(id,{...it,...patch});touch();return true;}
const RESET_NOTE="resetNoteFile";

function safeName(t){return String(t).replace(/[\\/:*?"<>|]+/g," ").trim().slice(0,80)||"roadmap";}
function fileName(){
  let n="";
  try{n=decodeURIComponent(location.pathname.split("/").pop()||"");}catch(e){}
  if(!/\.html?$/i.test(n)) n=safeName(S.title||L("appName"))+".html";
  return n;
}
function buildHtml(){
  const json=JSON.stringify(snapshot()).replace(/</g,"\\u003c");
  return PRISTINE.replace(/(<script type="application\/json" id="roadmapData">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b);
}
function downloadBlob(blob,name){
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
function markSaved(stamp){savedStamp=stamp||S.modifiedAt||"";autosave();renderSaveState();if(!isDirty())$("banner").innerHTML="";else scheduleAuto();}
async function saveFile(asNew){
  if(!S.modifiedAt) S.modifiedAt=new Date().toISOString();
  const name=asNew?safeName(S.title||L("appName"))+".html":fileName();
  if(CAN_WRITE){
    try{
      if(!fileHandle&&pendingHandle&&!asNew){
        if(await pendingHandle.requestPermission({mode:"readwrite"})==="granted") useHandle(pendingHandle);
      }
      if(!fileHandle||asNew) useHandle(await window.showSaveFilePicker({suggestedName:name,types:[{description:L("fileDesc"),accept:{"text/html":[".html",".htm"]}}]}));
      if(await writeHandle()){toast(L("savedTo",fileHandle.name)+(autoOn?L("autoFromNow"):""));return;}
    }catch(e){ if(e&&e.name==="AbortError") return; }
  }
  downloadBlob(new Blob([buildHtml()],{type:"text/html;charset=utf-8"}),name);
  markSaved(); toast(L("downloaded",name));
}
function exportCsv(){
  const list=[...S.items.values()].sort((a,b)=>a.offset-b.offset||(a.time||"99").localeCompare(b.time||"99"));
  const p2=n=>String(n).padStart(2,"0");
  const ymd=dn=>{const j=toCal(dn);return j.y+"/"+p2(j.m)+"/"+p2(j.d);};
  const rows=[L("csvHead",EV())].concat(list.map(it=>{
    const dn=ipoDn()+it.offset, f=flagsOf(it), P=perfOf(it), sum=k=>P.length?P.reduce((a,r)=>a+r[k],0):"";
    return [ymd(dn),WD_NAMES[S.lang][wd(dn)],it.offset===0?dayName():"D"+(it.offset>0?"+":"-")+Math.abs(it.offset),
      it.time||"",itemChs(it).join(L("sep")),it.type||"",it.title||"",stLabel(f.stage),L("p_"+(PRIOS.includes(it.priority)?it.priority:"normal")),
      it.owner||"",f.due!=null?ymd(f.due):"",it.blocker||"",goalLabel(it.goal),it.pillar||"",it.audience||"",
      it.notes||"",it.hook||"",it.cta||"",it.ref||"",it.caption||"",it.overlay||"",
      (Array.isArray(it.assets)?it.assets:[]).map(a=>(a.t?a.t+": ":"")+(a.u||"")).join(" | "),it.link||"",sum("v"),sum("e"),sum("c")];
  }));
  const csv="﻿"+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  downloadBlob(new Blob([csv],{type:"text/csv;charset=utf-8"}),safeName(S.title||L("appName"))+".csv");
  toast(L("csvDone"));
}

  if(t.dataset.alert!==undefined){openAlert(t.dataset.alert);return;}
  if(t.dataset.clrf!==undefined){S.fCh="";S.fSt="*";S.fPe="";S.q="";$("fQ").value="";renderFilters();render();return;}
  if(t.dataset.close!==undefined){closeDrawer();return;}
  if(t.dataset.back!==undefined){openDay(+t.dataset.back);return;}
  if(t.dataset.day!==undefined){openDay(+t.dataset.day);return;}
  if(t.dataset.item!==undefined){openEditor(t.dataset.item);return;}
  if(t.dataset.add!==undefined){openEditor(null,+t.dataset.add);return;}
  if(t.dataset.nav!==undefined){
    const v=t.dataset.nav;
    if(v==="0"||v==="t") showMonthOf(v==="0"?ipoDn():todayDn());
    else{let m=S.mm-(+v);let y=S.my; if(m<1){m=12;y--;} if(m>12){m=1;y++;} S.my=y;S.mm=m;}
    renderCal();
  }
});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if($("modalRoot").innerHTML){closeModal();return;}if($("drawerRoot").innerHTML)closeDrawer();});
const setView=v=>{S.view=v;try{localStorage.setItem("roadmap-view",v)}catch(e){}render();};
$("vCal").onclick=()=>setView("cal");
$("vRoad").onclick=()=>setView("road");
$("vBoard").onclick=()=>setView("board");
$("vChart").onclick=()=>setView("chart");
$("langBtn").onclick=()=>setLang($("langBtn").dataset.lang);
window.addEventListener("scroll",()=>{$("tip").hidden=true;},{passive:true});
$("fCh").onchange=e=>{S.fCh=e.target.value;render();};
$("fSt").onchange=e=>{S.fSt=e.target.value;render();};
$("fQ").addEventListener("input",e=>{S.q=e.target.value;render();});
$("addBtn").onclick=()=>{const t=todayDn();openEditor(null,S.ipo!=null&&t>ipoDn()+30?ipoDn():t);};
$("openSettings").onclick=()=>openSettings();
$("manageCh").onclick=()=>openSettings("ch");
$("managePe").onclick=()=>openSettings("pe");
$("manageTy").onclick=()=>openSettings("ty");
$("resetBtn").onclick=openReset;
$("fPe").onchange=e=>{S.fPe=e.target.value;render();};
[["campTitle","title"],["campSub","subtitle"]].forEach(([id,key])=>{
  const el=$(id);
  el.addEventListener("change",()=>{const v=el.value.trim();if(v!==S[key])saveSettings({[key]:v});});
  el.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();el.blur();}});
});
/* board: drag a card onto another stage's column */
const mainEl=$("main"), colAt=e=>e.target&&e.target.closest?e.target.closest(".bcol"):null;
const clearDrop=keep=>mainEl.querySelectorAll(".bcol.drop").forEach(x=>{if(x!==keep)x.classList.remove("drop");});
mainEl.addEventListener("dragstart",e=>{const c=e.target&&e.target.closest&&e.target.closest("[data-drag]");if(!c)return;e.dataTransfer.setData("text/plain",c.dataset.drag);e.dataTransfer.effectAllowed="move";c.classList.add("dragging");});
mainEl.addEventListener("dragend",e=>{const c=e.target&&e.target.closest&&e.target.closest("[data-drag]");if(c)c.classList.remove("dragging");clearDrop(null);});
mainEl.addEventListener("dragover",e=>{const col=colAt(e);if(!col)return;e.preventDefault();e.dataTransfer.dropEffect="move";clearDrop(col);col.classList.add("drop");});
mainEl.addEventListener("dragleave",e=>{const col=colAt(e);if(col&&!col.contains(e.relatedTarget))col.classList.remove("drop");});
mainEl.addEventListener("drop",e=>{
  const col=colAt(e); if(!col) return;
  e.preventDefault(); clearDrop(null);
  const id=e.dataTransfer.getData("text/plain"), it=S.items.get(id);
  if(it&&stageOf(it)!==col.dataset.stage) setStage(id,col.dataset.stage);
});

$("saveBtn").onclick=()=>saveFile(false);
$("saveAsBtn").onclick=()=>saveFile(true);
$("autoChk").onchange=e=>{
  autoOn=e.target.checked; try{localStorage.setItem("roadmap-autosave",autoOn?"1":"0");}catch(err){}
  renderSaveState();
  if(autoOn){if(fileHandle)scheduleAuto();else toast(pendingHandle?L("autoResumeHint"):L("autoOnHint"));}
};
$("resumeBtn").onclick=async()=>{
  if(!pendingHandle) return;
  try{
    if(await pendingHandle.requestPermission({mode:"readwrite"})==="granted"){
      useHandle(pendingHandle); if(isDirty()) await writeHandle(); else renderSaveState();
      toast(L("autoResumed",fileHandle.name));
    }
  }catch(e){toast(L("noPermission"));}
};
$("csvBtn").onclick=exportCsv;
$("importBtn").onclick=()=>{$("importFile").value="";$("importFile").click();};
$("importFile").onchange=async e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  let d=null;
  try{
    const t=await f.text();
    if(/^\s*\{/.test(t)) d=JSON.parse(t);
    else{const m=t.match(/<script type="application\/json" id="\w+Data">([\s\S]*?)<\/script>/); if(m) d=JSON.parse(m[1]);}
  }catch(err){d=null;}
  if(!d||!d.items||typeof d.items!=="object"){toast(L("badFile"));return;}
  const n=Object.keys(d.items).length;
  $("banner").innerHTML='<div class="banner">'+esc(L("importAsk",f.name,n))+
    '<button class="btn primary" type="button" id="bnImport">'+L("replace")+'</button><button class="btn" type="button" id="bnCancel">'+L("cancel")+'</button></div>';
  $("bnCancel").onclick=()=>{$("banner").innerHTML="";};
  $("bnImport").onclick=()=>{applyData(d);touch();$("banner").innerHTML="";renderFilters();render();toast(L("imported"));};
};
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.code==="KeyS"){e.preventDefault();saveFile(false);}});
window.addEventListener("beforeunload",e=>{if(isDirty()){e.preventDefault();e.returnValue="";}});

/* ---------- boot ---------- */
function applyData(d){
  applySettings(d);
  S.items=new Map(Object.entries(d.items||{}).filter(([,v])=>v&&typeof v.offset==="number"));
  S.modifiedAt=d.modifiedAt||"";
  showMonthOf(S.ipo!=null?S.ipo:todayDn());
}
let local=null; try{local=JSON.parse(localStorage.getItem(LS_KEY)||"null");}catch(e){}
if(local&&local.modifiedAt&&(!EMB.modifiedAt||local.modifiedAt>EMB.modifiedAt)){
  applyData(local);
  $("banner").innerHTML='<div class="banner">'+L("recovered")+
    '<button class="btn primary" type="button" id="bnSave">'+L("saveToFile")+'</button><button class="btn" type="button" id="bnFile">'+L("backToFile")+'</button></div>';
  $("bnSave").onclick=()=>saveFile(false);
  $("bnFile").onclick=()=>{applyData(EMB);savedStamp=EMB.modifiedAt||"";try{localStorage.removeItem(LS_KEY);}catch(e){}$("banner").innerHTML="";renderFilters();render();renderSaveState();};
}else{
  applyData(EMB);
}
$("fileName").textContent=fileName();
render(); renderSaveState();
(async()=>{
  if(!CAN_WRITE) return;
  try{
    const h=await IDB.get(LS_KEY);
    if(!h||h.name!==fileName()) return;
    if(await h.queryPermission({mode:"readwrite"})==="granted"){useHandle(h);renderSaveState();scheduleAuto();}
    else{pendingHandle=h;renderSaveState();}
  }catch(e){}
})();
})();
</script>
</body>
</html>
